name: 미국 고점 대비 하락 종목

on:
  schedule:
    - cron: "27 22 * * 1-5"   # 화~토 07:27 KST (미국 장 마감 후)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}   # 작업별로 따로(같은 그룹이면 대기 중인 실행이 취소됨). 커밋 충돌은 아래 pull --rebase 재시도로 처리
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: S&P500·나스닥100 하락 종목 계산
        run: python3 scripts/fetch_us_drawdown.py data.json us_drawdown.json
      - name: 바뀐 경우에만 커밋
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add us_drawdown.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "미국 하락 종목 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
