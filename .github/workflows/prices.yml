name: 시세 전체 이력 수집

on:
  schedule:
    - cron: "13 * * * *"   # 매시 13분 (GitHub 사정에 따라 늦어질 수 있음)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}   # 작업별로 따로(같은 그룹이면 대기 중인 실행이 취소됨). 커밋 충돌은 아래 pull --rebase 재시도로 처리
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: 시세 수집
        run: python3 scripts/fetch_prices.py prices.json
      - name: 바뀐 경우에만 커밋
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "시세 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
