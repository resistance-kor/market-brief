name: 국내 고점 대비 하락 종목

on:
  schedule:
    - cron: "47 7 * * 1-5"   # 평일 16:47 KST (장 마감 후)
    - cron: "17 23 * * 0-4"  # 평일 08:17 KST (전일 종가 재확인)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 코스피200 하락 종목 계산
        run: python3 scripts/fetch_kr_drawdown.py kr_drawdown.json
      - name: 바뀐 경우에만 커밋
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kr_drawdown.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "국내 하락 종목 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
