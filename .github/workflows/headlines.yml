name: 실시간 헤드라인 수집

on:
  schedule:
    - cron: "7,27,47 * * * *"   # 20분마다 (GitHub 사정에 따라 몇 분 늦어질 수 있음)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 헤드라인 수집
        run: python3 scripts/fetch_headlines.py headlines.json
      - name: 바뀐 경우에만 커밋
        run: |
          git config user.name "headline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add headlines.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "헤드라인 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
